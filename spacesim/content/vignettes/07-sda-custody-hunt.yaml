vignette:
  id: sda-custody-hunt
  title: "SDA Custody Hunt"
  classification: UNCLASSIFIED-TRAINING
  learning_objectives:
    - "Custody decays between looks; scarce sensors force prioritization (contention)."
    - "Red wins by breaking custody — deception, dispersal, or suppressing the sensor."
  doctrinal_basis: [sda]
  red_doctrine_profile: china_integrated
  start_epoch_utc: "2030-03-15T06:00:00Z"
  blue_forces: []
  red_forces:
    - id: RED-OBJ
      kind: satellite
      orbit: {a_m: 7178137.0, e: 0.0, i_deg: 63.4, raan_deg: 80, argp_deg: 0, ta_deg: 0.0}
      resources: {delta_v_ms: 150.0}
  sensors:
    # BLUE-RADAR-1 = Eglin AFB AN/FPS-85 — dedicated SSN phased-array radar, FL.
    - {id: BLUE-RADAR-1, owner: blue, kind: ground_radar, location: {lat_deg: 30.57, lon_deg: -86.21}}
    # BLUE-OPT-1 = GEODSS Det 1 (Socorro, White Sands NM) — primary optical SDA, contended with radar.
    - {id: BLUE-OPT-1, owner: blue, kind: ground_optical, location: {lat_deg: 33.82, lon_deg: -106.66}, needs_lighting: true}
  objectives:
    blue:
      - {id: maintain_custody, desc: "Maintain custody of the hostile object", metric: {kind: custody, side: blue, object: RED-OBJ, min_conf: 0.5}}
    red:
      - {id: break_custody, desc: "Break Blue's custody by the deadline", metric: {kind: deny_custody, side: blue, object: RED-OBJ, min_conf: 0.5, by_s: 5400}}
  parameters:
    - {id: blue_sensor_count, label: "Blue Sensors", type: int, min: 1, max: 4, default: 2}
    - {id: red_doctrine_profile, label: "Red Doctrine", type: enum, options: [china_integrated, russia_ew_first, generic], default: china_integrated}
    - {id: fog_of_war, label: "Fog of War", type: enum, options: [full_god_view, realistic_sda, heavy_fog], default: realistic_sda}
    - {id: landing_window_start_s, label: "Hunt Window (s)", type: int, default: 5400}
    - {id: ssn_blue_dispersion, label: "Blue SSN dispersion", type: enum,
       options: [off, sparse, regional, global, proliferated], default: global}
    - {id: ssn_red_dispersion,  label: "Red SSN dispersion",  type: enum,
       options: [off, sparse, regional, global, proliferated], default: off}
  injects: []
  tutorial:
    blue:
      - {n: 1, title: "Read the mission", when: "at start", action: review,
         expect: "Open the Mission brief. You win (maintain_custody) if your track on RED-OBJ has confidence 0.5 or better at T+90 min. Confidence halves every 30 min without a new look. Your own radar and optical sensor cannot see RED-OBJ until about T+134 min, so the Space Surveillance Network (SSN) is your only source in time."}
      - {n: 2, title: "Ask the SSN for a first look", when: "issue now - Command bar chip 'SSN request'",
         action: ssn_request, actor: SSN, target: RED-OBJ, params: {intent: characterize, regime: LEO, priority: priority},
         expect: "Accepted: state SCHEDULED, product due about T+15 min. The SSN is a shared service: you request, it collects when a sensor can see the target, then it delivers the track."}
      - {n: 3, title: "Advance ten minutes", when: "click +10m once (now T+10 min)", action: advance, params: {dt_s: 600},
         expect: "Nothing has arrived yet (maintain_custody is still unmet) - products take time."}
      - {n: 4, title: "Re-task before the first look decays", when: "issue now (T+10 min)",
         action: ssn_request, actor: SSN, target: RED-OBJ, params: {intent: characterize, regime: LEO, priority: priority},
         expect: "A second request, product due about T+25 min. Rule of thumb: keep one request in flight at all times. After the first product arrives (T+15 min) maintain_custody becomes MET."}
      - {n: 5, title: "Keep re-tasking every 20 minutes", when: "advance with +10m and file the same request again at T+30, T+50 and T+70 min",
         action: ssn_request, actor: SSN, target: RED-OBJ, params: {intent: characterize, regime: LEO, priority: priority},
         expect: "Each product lands before the previous one decays below 0.5, so maintain_custody never lapses. If you skip a request, confidence drops below 0.5 about 30 min after the last product."}
      - {n: 6, title: "Hold to the deadline", when: "click +10m until the clock is past T+90 min",
         action: advance, params: {dt_s: 1201},
         expect: "maintain_custody MET and Red's break_custody NOT met. Your own radar's first pass (BLUE-RADAR-1 at about T+134 min) comes after the deadline - an optional observe order then adds a second source."}
    red:
      - {n: 1, title: "Read the mission", when: "at start", action: review,
         expect: "Open the Mission brief. You win (break_custody) if Blue's track on RED-OBJ is below 0.5 confidence at T+90 min. You cannot touch the sensors; you win by Blue's neglect or by denying looks."}
      - {n: 2, title: "Understand the contention", when: "throughout", action: review,
         expect: "If Blue never files a request, break_custody is MET by default at T+90 min. A diligent Blue refreshes every 20 minutes; your pressure comes from timing, deception and dispersal, not from firepower."}
      - {n: 3, title: "Try a burn", when: "issue now", action: maneuver, actor: RED-OBJ, params: {dv: [0.0, 5.0, 0.0]},
         expect: "BLOCKED: Issue order stays greyed out and the preview turns red: 'No command path - set a ground station (via) or a stored-program time' (if the form adds a via, 'No access window in the planning horizon'). The engine reason is no_command_station. RED-OBJ needs a Red command path; with one, a burn timed outside a Blue pass would enlarge Blue's uncertainty. A facilitator can only add a ground station before Start (HTTP force-add, see the White Cell manual); it cannot be added mid-exercise."}
      - {n: 4, title: "Run out the clock", when: "click +10m until the clock is past T+90 min",
         action: advance, params: {dt_s: 5401},
         expect: "If Blue did nothing, break_custody is MET: custody below 0.5 at the deadline. If Blue re-tasked in time, it is not."}
  intro_brief:
    blue:
      situation: "LEO, March 2030. A Red object of interest (RED-OBJ) has been intermittently characterized. National command requires sustained custody — but our two sensors are CONTENDED (each can service one target at a time)."
      mission: "Maintain confidence ≥ 0.5 on RED-OBJ for the +90 min window. The lesson: SDA is finite — sensor contention forces tasking priorities and confidence decays half-life is 30 min."
      friendly_forces: "BLUE-RADAR (ground radar) + BLUE-OPT-1 (Maui optical, needs darkness). Note: NO Blue satellites this vignette — your order panel will have NO actor for satellite commands; you can only task SENSORS."
      threat_picture: "RED-OBJ (LEO bus, 100 m/s Δv reserve)."
      deadline_note: "T+90 min (5400 s). Confidence halves every 30 min without observation."
      roe_note: "No kinetic option. The fight is custody."
      success_criteria: "custody MET: track confidence on RED-OBJ ≥ 0.5 at T+90 min."
      tool_tips: "Your own sensors (BLUE-RADAR-1, BLUE-OPT-1) cannot see RED-OBJ before about T+134 min, so use the Space Surveillance Network: Command bar → SSN request · intent characterize · target RED-OBJ · regime LEO · priority priority. Each product lands 15-25 min after you ask, so file a new request about every 20 min (T+0, +10, +30, +50, +70) to beat the 30-min half-life. The Tracks (custody) table shows current confidence (decays continuously between observations)."
    red:
      situation: "LEO, March 2030. Mission tasking: break Blue's custody hold on RED-OBJ. Blue has two sensors but they're contended — your job is to maneuver between looks so that no single sensor window catches you cleanly."
      mission: "Stay below confidence 0.5 in Blue's track at T+90 min. The lesson: SDA contention is a finite resource — exploit it by timing burns outside sensor windows."
      friendly_forces: "RED-OBJ (LEO bus, 100 m/s Δv). No Red ground TT&C station — burns are White-Cell / Red-doctrine adjudicated."
      threat_picture: "BLUE-RADAR + BLUE-OPT-1 (contended). BLUE-OPT-1 needs darkness to see you."
      deadline_note: "Run out the clock to T+90 min with confidence below 0.5."
      roe_note: "No kinetic this vignette. Maneuvering and timing are the entire game."
      success_criteria: "break_custody MET: Blue's confidence on RED-OBJ < 0.5 at T+90 min."
      tool_tips: "Mostly passive: advance time. Burns are White-Cell adjudicated this vignette. The lesson plays out organically — Blue often can't keep up with the half-life across two contended sensors."

