vignette:
  id: co-orbital-threat-escort
  title: "Co-Orbital Threat & Escort"
  classification: UNCLASSIFIED-TRAINING
  learning_objectives:
    - "Active defense: an escort interposes and a high-value asset maneuvers to evade."
    - "Spending delta-v to survive trades against mission lifetime."
  doctrinal_basis: [orbital_warfare]
  red_doctrine_profile: china_integrated
  start_epoch_utc: "2030-03-15T06:00:00Z"
  blue_forces:
    - id: BLUE-HVA
      kind: satellite
      orbit: {a_m: 7078137.0, e: 0.0, i_deg: 53.0, raan_deg: 180, argp_deg: 0, ta_deg: 0.0}
      resources: {delta_v_ms: 120.0}
      bus_state: {power: {battery_soc: 0.95}}
    - id: BLUE-ESCORT
      kind: satellite
      orbit: {a_m: 7078137.0, e: 0.0, i_deg: 53.0, raan_deg: 180, argp_deg: 0, ta_deg: 1.0}
      resources: {delta_v_ms: 200.0}
  red_forces:
    - id: RED-COORB
      kind: satellite
      orbit: {a_m: 7078137.0, e: 0.0, i_deg: 53.0, raan_deg: 180, argp_deg: 0, ta_deg: 3.0}
      resources: {delta_v_ms: 300.0}
  sensors:
    # BLUE-RADAR = RAF Fylingdales (UEWR), UK — UK Space Command SDA flagship.
    - {id: BLUE-RADAR, owner: blue, kind: ground_radar, location: {lat_deg: 54.36, lon_deg: -0.67}}
  objectives:
    blue:
      - {id: hva_survives, desc: "Keep the HVA alive through the window", metric: {kind: asset_survived, target: BLUE-HVA, by_s: 3600}}
    red:
      - {id: neutralize_hva, desc: "Neutralize the HVA", metric: {kind: asset_safed, target: BLUE-HVA}}
  parameters:
    - {id: rpo_closing_speed, label: "Red RPO Aggressiveness", type: enum, options: [cautious, normal, aggressive], default: aggressive}
    - {id: blue_passive_defenses, label: "Blue Passive Defenses", type: multiselect, options: [maneuver, deception, hardening, dispersal, redundancy], default: [maneuver, redundancy]}
    - {id: red_doctrine_profile, label: "Red Doctrine", type: enum, options: [china_integrated, russia_ew_first, generic], default: china_integrated}
    - {id: fog_of_war, label: "Fog of War", type: enum, options: [full_god_view, realistic_sda, heavy_fog], default: realistic_sda}
    - {id: landing_window_start_s, label: "Threat Window (s)", type: int, default: 3600}
  injects: []
  tutorial:
    blue:
      - {n: 1, title: "Read the mission", when: "at start", action: review,
         expect: "Open the Mission brief. BLUE-HVA is your high-value satellite and BLUE-ESCORT flies with it. You win (hva_survives) if BLUE-HVA is still alive at T+1 h. RED-COORB is a Red satellite flying in the same orbit."}
      - {n: 2, title: "Task the radar on the co-orbital threat", when: "issue now - BLUE-RADAR's pass opens about T+17 min",
         action: observe, actor: BLUE-RADAR, target: RED-COORB, params: {intent: characterize, classification: hostile},
         expect: "The order is queued with a window starting about T+17 min. Plan first, then the sensor collects. Characterizing gives you a track on the approaching threat."}
      - {n: 3, title: "Advance to the radar pass", when: "click +10m twice (the clock is now T+20 min, inside the pass)", action: advance, params: {dt_s: 1200},
         expect: "RED-COORB appears as a hostile track in your Fleet panel."}
      - {n: 4, title: "Try an evasive burn", when: "after you have the track", action: maneuver, actor: BLUE-HVA, params: {dv: [0.0, 5.0, 0.0]},
         expect: "BLOCKED: Issue order stays greyed out and the preview turns red: 'No command path - set a ground station (via) or a stored-program time' (if the form adds a via, 'No access window in the planning horizon'). The engine reason is no_command_station. Nothing in this scenario can send commands to BLUE-HVA. The block is the lesson - active defense needs a command path. A facilitator can only add a ground station before Start (HTTP force-add, see the White Cell manual); it cannot be added mid-exercise."}
      - {n: 5, title: "Hold to the deadline", when: "click +10m until the clock is past T+1 h (about 6 clicks)",
         action: advance, params: {dt_s: 2401},
         expect: "hva_survives MET. Red has no kinetic authority and no way to safe the HVA here, so it can pressure but not win."}
    red:
      - {n: 1, title: "Read the mission", when: "at start", action: review,
         expect: "Open the Mission brief. RED-COORB (300 m/s of delta-v) must safe BLUE-HVA (neutralize_hva). You have no kinetic authority."}
      - {n: 2, title: "Try a closing burn", when: "issue now", action: maneuver, actor: RED-COORB, params: {dv: [0.0, 3.0, 0.0]},
         expect: "BLOCKED: Issue order stays greyed out and the preview turns red: 'No command path - set a ground station (via) or a stored-program time' (if the form adds a via, 'No access window in the planning horizon'). The engine reason is no_command_station. You have no command path to RED-COORB either; maneuvers need an uplink to a ground station. A facilitator can only add a ground station before Start (HTTP force-add, see the White Cell manual); it cannot be added mid-exercise."}
      - {n: 3, title: "Hold to the deadline", when: "click +10m until the clock is past T+1 h (about 6 clicks)",
         action: advance, params: {dt_s: 3601},
         expect: "neutralize_hva stays unmet. The lesson is restraint: pressure short of an irreversible act, and the signalling value of proximity."}
  intro_brief:
    blue:
      situation: "LEO, March 2030. A Red co-orbital satellite has been observed maneuvering toward our high-value LEO asset (BLUE-HVA). Closing geometry suggests a posture demonstration rather than imminent attack — but intent is unclear."
      mission: "Keep BLUE-HVA outside 50 km of RED-COORB for the +60 min watch window. Active defense (escort, maneuver-to-evade) is the right move IF you have command authority — otherwise the deterrent value is in the watch itself."
      friendly_forces: "BLUE-HVA (LEO high-value asset). BLUE-ESCORT (co-orbital escort with Δv reserve). BLUE-RADAR (Eglin) for tracking. Note: this vignette ships NO Blue ground station — manoeuvres are not directly issuable."
      threat_picture: "RED-COORB (Red co-orbital, 300 m/s Δv). Capable of multiple closing burns within a +60 min window."
      deadline_note: "T+60 min (3600 s). Range threshold is 50 km."
      roe_note: "No kinetic option. No command station — maneuver returns no_command_station. Custody-and-warning is the deliverable."
      success_criteria: "evade MET: range(BLUE-HVA, RED-COORB) ≥ 50 km at T+60 min."
      tool_tips: "Mostly observational this vignette. Task BLUE-RADAR on RED-COORB to maintain custody and watch the closing geometry on the 3D globe. White Cell adjudicates manoeuvres in this vignette."
    red:
      situation: "LEO, March 2030. Mission tasking is to demonstrate co-orbital threat against a Blue high-value LEO asset (BLUE-HVA) — pressure without destruction. Political objective: signal capability while staying below the kinetic threshold."
      mission: "Close RED-COORB on BLUE-HVA to demonstrate proximity threat. Outright destruction is OFF the table this vignette — the teaching point is restraint."
      friendly_forces: "RED-COORB (Red co-orbital threat, 300 m/s Δv reserve). No Red ground TT&C station — closing burns are White-Cell / Red-doctrine adjudicated."
      threat_picture: "BLUE-HVA + BLUE-ESCORT in LEO. Blue can characterize you via BLUE-RADAR but has no organic maneuver-to-evade path in this vignette."
      deadline_note: "Drive closing range below 50 km by T+60 min."
      roe_note: "neutralize_hva CANNOT complete in this vignette — kinetic ROE is OFF, and there's no weapons-quality track gate to satisfy. This is intentional. The deliverable is the pressure, not the kill."
      success_criteria: "neutralize_hva is RED's stated objective but is doctrine-gated off — by design, this vignette teaches restraint."
      tool_tips: "Action: maneuver · actor: RED-COORB. If maneuver returns no_command_station, this vignette expects White-Cell adjudication. Closing geometry shows on the 3D globe (top right) — the visual is the point."

