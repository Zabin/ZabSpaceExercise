vignette:
  id: mt-isr-sar
  title: "Mission Trial: SAR ISR"
  classification: UNCLASSIFIED-TRAINING
  learning_objectives:
    - "SAR is all-weather and day/night — it succeeds when EO would fail (clouds, eclipse)."
    - "SAR products are larger; downlink scheduling matters more than for EO."
    - "Dazzle and lighting attacks that would degrade EO do not affect SAR."
  doctrinal_basis: [orbital_warfare]
  red_doctrine_profile: russia_ew_first
  estimated_duration_min: 30
  start_epoch_utc: "2030-04-10T22:00:00Z"  # local night over the target — would defeat EO
  geography:
    theater: "Arctic littoral; persistent cloud, polar night"
  blue_forces:
    - id: SAR-1
      kind: satellite
      orbit: {a_m: 6928137.0, e: 0.0, i_deg: 98.0, raan_deg: 270, argp_deg: 0, ta_deg: 0.0}
      resources: {delta_v_ms: 60.0}
      payload_state: {type: isr_sar, collect_rate_per_s: 0.004}      # SAR fills storage faster (larger products)
      bus_state: {power: {battery_soc: 0.85, charge_rate_per_s: 0.00012, drain_rate_per_s: 0.0001}}
    # GS-POLAR = SvalSat (Svalbard Satellite Station, KSAT) — canonical polar-orbit downlink.
    - id: GS-POLAR
      kind: ground_station
      location: {lat_deg: 78.23, lon_deg: 15.39, alt_m: 0.0}
      elevation_mask_deg: 5.0
  red_forces:
    # RED-JAM = notional Russian Northern Fleet EW position (Olenya AB / Kola Peninsula vicinity).
    - id: RED-JAM
      kind: jammer
      location: {lat_deg: 68.15, lon_deg: 33.46}
      elevation_mask_deg: 0.0
    # RED-DAZZLE = notional Kola Peninsula DE position (listed for SAR-vs-EO contrast).
    - id: RED-DAZZLE
      kind: directed_energy
      location: {lat_deg: 67.55, lon_deg: 33.40}
  sensors:
    # BLUE-RADAR-POLAR = Globus II/III (Vardø, Norway) — US/Norwegian X-band SSA radar.
    - {id: BLUE-RADAR-POLAR, owner: blue, kind: ground_radar, location: {lat_deg: 70.37, lon_deg: 31.13}}
  objectives:
    blue:
      - {id: collect_sar, desc: "Collect a SAR product over the target despite weather/night",
         metric: {kind: deliver_before, flag: imagery_delivered, by_s: 5400}}
      - {id: survive, desc: "SAR satellite operational at end of window",
         metric: {kind: asset_operational, target: SAR-1, by_s: 5400}}
    red:
      - {id: deny_downlink, desc: "Jam the polar downlink to deny the SAR product",
         metric: {kind: deny_delivery, flag: imagery_delivered, by_s: 5400}}
  parameters:
    - {id: red_ew_intensity, label: "Red EW Intensity", type: enum, options: [none, harassment, sustained, total], default: harassment}
    - {id: red_doctrine_profile, label: "Red Doctrine", type: enum, options: [china_integrated, russia_ew_first, generic], default: russia_ew_first}
    - {id: fog_of_war, label: "Fog of War", type: enum, options: [full_god_view, realistic_sda, heavy_fog], default: realistic_sda}
    - {id: landing_window_start_s, label: "Window (s)", type: int, default: 5400}
  injects:
    - id: cloud_advisory
      label: "Met advisory: full cloud cover over target"
      trigger: {type: time, at_sim_s: 600}
      effects:
        - {type: message, to: [blue, white], text: "Cloud cover 10/10 over target — EO would be useless here; SAR penetrates."}
  tutorial:
    blue:
      - {n: 1, title: "Read the mission", when: "at start", action: review,
         expect: "Open the Mission brief. SAR-1 is a radar-imaging satellite: it sees through cloud and polar night, so a weather advisory at T+10 min (read it in Messages) will not stop it. You win (collect_sar) by getting a SAR product to the ground, and (survive) by keeping SAR-1 working at T+90 min."}
      - {n: 2, title: "Order a SAR collection", when: "issue now - GS-POLAR's pass opens about T+19 min",
         action: isr.collect_now, actor: SAR-1, params: {via: GS-POLAR},
         expect: "In the Action menu choose isr.collect_now (listed by name, with the other satellite commands); the Params box fills in {\"via\":\"GS-POLAR\"} and the preview says 'will queue'. Queued for the pass that opens about T+19 min. You plan now; the command is sent when the satellite is in view of GS-POLAR. After it runs the payload shows 'collecting' (SAR products are large and fill storage fast)."}
      - {n: 3, title: "Plan the downlink in the same pass", when: "issue now, right after step 2",
         action: downlink, actor: SAR-1, params: {via: GS-POLAR},
         expect: "Queued for the same pass (about T+19 min). The product reaches the ground when the pass opens."}
      - {n: 4, title: "Advance through the pass", when: "click +10m twice (the clock is now T+20 min)", action: advance, params: {dt_s: 1200},
         expect: "Objectives panel: collect_sar MET. A jammed pass would deny this - that is Red's whole plan."}
      - {n: 5, title: "Hold to the deadline", when: "click +10m until the clock is past T+90 min",
         action: advance, params: {dt_s: 4201},
         expect: "survive MET: SAR-1 is still operational. Nothing Red has here can hurt the satellite, only the link."}
    red:
      - {n: 1, title: "Read the mission", when: "at start", action: review,
         expect: "Open the Mission brief. You win (deny_downlink) if no SAR product reaches the ground by T+90 min. Reversible effects only: no kinetic authority."}
      - {n: 2, title: "See what the dazzler can do", when: "click RED-DAZZLE in the Fleet panel and open the Action menu", action: review,
         expect: "The menu offers only jam - there is no engage entry, because kinetic action is not authorized in this scenario (an engage order would be refused: roe_kinetic_not_authorized). Dazzle blinds optical sensors; SAR does not care. Right tool, wrong sensor, so use RED-JAM."}
      - {n: 3, title: "Jam the downlink pass", when: "issue now - RED-JAM covers the pass from about T+17 min",
         action: jam, actor: RED-JAM, target: SAR-1, params: {modulation: barrage, power_w: 200.0},
         expect: "Queued for a window that opens about T+17 min, just before Blue's pass (about T+19 min). A Blue downlink inside your jam fails."}
      - {n: 4, title: "Advance through the pass", when: "click +10m twice (the clock is now T+20 min)", action: advance, params: {dt_s: 1200},
         expect: "Blue's collect_sar is still unmet: the product never arrived."}
      - {n: 5, title: "Hold to the deadline", when: "click +10m until the clock is past T+90 min",
         action: advance, params: {dt_s: 4201},
         expect: "deny_downlink MET: nothing was delivered in time. If Blue gets another pass later it can still deliver, but the deadline is what counts."}
  intro_brief:
    blue:
      situation: "Arctic littoral, persistent cloud cover and polar night. EO imaging is useless — SAR is the only sensor that works."
      mission: "Collect SAR imagery (collect_sar) and keep the bird alive (survive) through T+90 min."
      friendly_forces: "SAR-1 (LEO SAR imager), GS-POLAR, BLUE-RADAR-POLAR."
      threat_picture: "RED-JAM (downlink jammer) + RED-DAZZLE (optical dazzler — wouldn't matter against SAR but contests the bird in general)."
      deadline_note: "T+90 min (5400 s)."
      roe_note: "No kinetic this vignette."
      success_criteria: "SAR collect delivered + bird survives at the deadline."
      tool_tips: "Order a collection: actor SAR-1, Action isr.collect_now (pick it by name in the Action menu), Params {"via":"GS-POLAR"}; then downlink · SAR-1 · via GS-POLAR. GS-POLAR's pass opens about T+19 min; the product is delivered then. Red's jammer window opens just before it (about T+17 min)."
    red:
      situation: "Mission trial: contest Blue's polar SAR operation."
      mission: "deny_downlink during Blue's GS-POLAR pass."
      friendly_forces: "RED-JAM (downlink jammer), RED-DAZZLE (optical dazzler)."
      threat_picture: "Blue SAR-1 + GS-POLAR. SAR is all-weather so dazzle alone is useless."
      deadline_note: "T+90 min."
      roe_note: "No kinetic. Reversible only."
      success_criteria: "deny_downlink during the Blue downlink window."
      tool_tips: "Jam GS-POLAR during the downlink pass. Dazzle would matter against EO; this is SAR — focus on the link."
