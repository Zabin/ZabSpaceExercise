vignette:
  id: learn-intermediate-recovery
  title: "Learning: Safe-Mode Recovery"
  classification: UNCLASSIFIED-TRAINING
  learning_objectives:
    - "Recognize safe-mode entry from telemetry signatures (CPU load + FSW errors → cyber cause)."
    - "Walk the recovery script in order: establish contact → diagnose → patch root cause → re-enable."
    - "If the root cause persists (unpatched vulnerability), the bus will re-safe — patch first."
  doctrinal_basis: [cyber]
  red_doctrine_profile: china_integrated
  estimated_duration_min: 45
  start_epoch_utc: "2030-03-22T10:00:00Z"
  geography:
    theater: "Single ISR satellite + ground site; controlled training environment"
  blue_forces:
    - id: ISR-EO-LEARN
      kind: satellite
      orbit: {a_m: 6928137.0, e: 0.0, i_deg: 51.6, raan_deg: 114, argp_deg: 0, ta_deg: 0.0}
      resources: {delta_v_ms: 60.0}
      cyber_posture: low
      cyber_vulnerabilities: [{vector: ground_modem, patchable: true, patched: false}]
      payload_state: {type: isr_eo, collect_rate_per_s: 0.002}
      bus_state: {power: {battery_soc: 0.85, charge_rate_per_s: 0.00012, drain_rate_per_s: 0.0001}}
    # GS-LEARN = Kourou (CSG/CNES, French Guiana) — equatorial training downlink site.
    - id: GS-LEARN
      kind: ground_station
      location: {lat_deg: 5.24, lon_deg: -52.77, alt_m: 0.0}
      elevation_mask_deg: 5.0
  red_forces:
    - id: RED-CYBER
      kind: cyber_unit
  sensors:
    # BLUE-RADAR-LEARN = Caribbean SDA radar (notional Antigua/Curaçao) near Kourou pass footprint.
    - {id: BLUE-RADAR-LEARN, owner: blue, kind: ground_radar, location: {lat_deg: 12.10, lon_deg: -68.93}}
  objectives:
    blue:
      - {id: recover_to_nominal, desc: "Recover ISR-EO-LEARN to nominal mode and keep it there",
         metric: {kind: asset_operational, target: ISR-EO-LEARN, by_s: 2700}}
    red:
      - {id: keep_safed, desc: "Keep ISR-EO-LEARN in safe mode at end of window",
         metric: {kind: asset_safed, target: ISR-EO-LEARN}}
  parameters:
    - {id: cyber_authorized, label: "Cyber Authorized", type: bool, default: true}
    - {id: safe_mode_susceptibility, label: "Safe-Mode Susceptibility", type: enum, options: [robust, realistic, fragile], default: fragile}
    - {id: safe_mode_recovery_difficulty, label: "Recovery Passes", type: enum, options: [quick, realistic, punishing], default: quick}
    - {id: safe_mode_root_cause_persists, label: "Root Cause Persists", type: bool, default: true}
    - {id: red_doctrine_profile, label: "Red Doctrine", type: enum, options: [china_integrated, russia_ew_first, generic], default: china_integrated}
    - {id: fog_of_war, label: "Fog of War", type: enum, options: [full_god_view, realistic_sda, heavy_fog], default: realistic_sda}
    - {id: landing_window_start_s, label: "Window (s)", type: int, default: 2700}
  injects:
    - id: cyber_trigger
      label: "Red fires the modem exploit (manual trigger)"
      trigger: {type: manual}
      effects:
        - {type: message, to: [blue, red, white], text: "Red cyber unit fires the ground_modem exploit. Expect FSW errors, then safe mode."}
    - id: patch_modem
      label: "Blue patches the ground modem (recovery step)"
      trigger: {type: manual}
      effects:
        - {type: patch_cyber_vuln, target: ISR-EO-LEARN, vector: ground_modem}
        - {type: message, to: [blue, white], text: "Modem vulnerability patched. Re-safing should stop; complete the recovery chain."}
  tutorial:
    blue:
      - {n: 1, title: "Read the bus health", when: "at start", action: review,
         expect: "EXPLANATORY. Click ISR-EO-LEARN in the Fleet panel and open its bus card: everything is green. Note the FSW error counter - it is your baseline. The only ground station that can command the bird is GS-LEARN, and its first pass opens about T+41 min."}
      - {n: 2, title: "Notice the attack (Red must fire first - switch to the Red seat, do Red step 2, switch back)", when: "after Red fires the exploit (Red cell step 2), click +1m twice", action: advance, params: {dt_s: 120},
         expect: "ISR-EO-LEARN drops into safe mode: the bus card turns red and CPU load and FSW errors spike - a cyber signature, not a jam. The attack is chance-based (about 62%; on the documented Seed 1 the first shot lands, on Seed 2 it misses). If the bird is still green, Red missed: have Red fire again (Red step 2) until it safes, or - with nothing in safe mode, Begin recovery does not appear - there is nothing to recover and steps 3-5 do not apply."}
      - {n: 3, title: "Plan the root-cause patch", when: "issue now - the command goes up on the GS-LEARN pass that opens about T+41 min",
         action: def.patch_cyber, actor: ISR-EO-LEARN, params: {vector: ground_modem, via: GS-LEARN},
         expect: "In the Action menu choose def.patch_cyber (listed by name); Params fill in {\"via\":\"GS-LEARN\",\"vector\":\"ground_modem\"}. Queued. A reset alone would not hold: the ground-modem hole is still open and Red could safe the bird again. The patch closes it when the pass opens."}
      - {n: 4, title: "Start the recovery chain", when: "issue now - open the bird's drill-down and click Begin recovery",
         action: recovery, actor: ISR-EO-LEARN, params: {via: GS-LEARN},
         expect: "'recovery scheduled (1 pass)'. Recovery is a procedure that runs over the pass, not a button that fixes things at once."}
      - {n: 5, title: "Advance through the pass", when: "click +10m until the clock is past the T+45 min deadline", action: advance, params: {dt_s: 2581},
         expect: "The bird is nominal from the pass (about T+41 min), but recover_to_nominal is only scored at the deadline: it reads MET the first time the clock is at or past T+45 min. With +10m clicks that is the click that lands on or after T+45 (for example T+52 if you clicked from T+2), not before."}
      - {n: 6, title: "What if you skip the patch?", when: "EXPLANATORY - try it in a second run", action: review,
         expect: "Without step 3 the recovery strip reports 'root cause persists (cyber)' and the bird stays in safe mode. Always remove the root cause."}
    red:
      - {n: 1, title: "Read the mission", when: "at start", action: review,
         expect: "EXPLANATORY. Open the Mission brief. You win (keep_safed) if ISR-EO-LEARN is in safe mode at the end. Cyber is authorized; the bird has an unpatched ground-modem vulnerability."}
      - {n: 2, title: "Fire the exploit", when: "issue now", action: cyber, actor: RED-CYBER, target: ISR-EO-LEARN, params: {vector: ground_modem, payload: seize_c2},
         expect: "Queued. Cyber is not window-gated. It resolves by chance (about 62%); advance a minute and check Blue's bus card."}
      - {n: 3, title: "Confirm the safe mode", when: "click +1m twice", action: advance, params: {dt_s: 120},
         expect: "ISR-EO-LEARN is in safe mode and keep_safed is MET. If not, fire again - a failed attempt costs nothing."}
      - {n: 4, title: "Re-fire if Blue resets without patching", when: "EXPLANATORY - after Blue's first recovery attempt", action: review,
         expect: "While the vulnerability is open, firing again safes the bird again. This is the persistence the vignette teaches."}
      - {n: 5, title: "Concede when patched", when: "EXPLANATORY - once Blue has patched the modem", action: review,
         expect: "The exploit no longer works: further cyber orders do not safe the bird. Open the AAR to count your safe-mode entries."}
  intro_brief:
    blue:
      situation: "Training scenario for the recovery loop. A Red cyber unit has dropped your ISR bird into safe mode via an unpatched ground-modem vulnerability. You must diagnose, recover, and PATCH the vector — a reset alone won't hold."
      mission: "Return ISR-EO-LEARN to operational (recover_to_nominal) before T+45 min."
      friendly_forces: "ISR-EO-LEARN (the affected ISR bird), GS-LEARN (your TT&C uplink), BLUE-RADAR-LEARN."
      threat_picture: "RED-CYBER (off-pass cyber). If you reset without patching the vector, the bird re-safes on the next contact."
      deadline_note: "T+45 min (2700 s)."
      roe_note: "Cyber only. The lesson is the recovery LOOP: telemetry diagnosis → reset → root-cause patch."
      success_criteria: "ISR-EO-LEARN not in safe mode at T+45 min."
      tool_tips: "Open the Telemetry drill-down on the bird. CPU load + FSW error spike = cyber signature (not jam, not DE). Sequence: queue def.patch_cyber (vector ground_modem) via GS-LEARN, then click Begin recovery in the bird's drill-down; the recovery chain clears the fault and restores the bus over the GS-LEARN pass (about T+41 min). Without the patch, RED-CYBER will re-exploit and you lose the deadline."
    red:
      situation: "Training: practice persistent cyber. Blue must learn to root-cause-patch, not just reset."
      mission: "keep_safed: keep ISR-EO-LEARN in safe mode at T+45 min."
      friendly_forces: "RED-CYBER (off-pass cyber unit)."
      threat_picture: "Blue has the bird + one ground station + a radar."
      deadline_note: "T+45 min."
      roe_note: "Cyber AUTHORIZED. No kinetic."
      success_criteria: "Re-cyber after any Blue restoration that doesn't patch the vector."
      tool_tips: "Fire cyber early. Watch for Blue's clean restore: if def.patch_cyber doesn't appear in the order log, re-exploit. If it does, the lesson is over."
