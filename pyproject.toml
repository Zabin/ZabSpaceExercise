[project]
name = "spacesim"
version = "0.1.0"
description = "Space Control & Orbital Warfare Exercise Simulator (PME wargaming tool)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14.2",
    "numpy>=2.5.4",
    "sgp4>=2.27",       # TLE propagation for real named satellites
]

[project.optional-dependencies]
content = ["pyyaml>=6.0.3"]
ui = ["fastapi>=0.162.0", "uvicorn>=0.54.0"]
# Build-time only: regenerate the committed static/world.json via tools/build_coastlines.py.
mapdata = ["basemap", "basemap-data"]
# skyfield is an independent reference in the Phase-2 tests; httpx powers the FastAPI TestClient;
# pillow renders the UI preview images in tools/render_screens.py.
dev = ["pytest>=9.2.0", "hypothesis>=6.170.14", "skyfield>=1.55", "fastapi>=0.162.0", "httpx>=0.28.1", "pillow>=13.0.0", "playwright>=1.64.1"]

[tool.pytest.ini_options]
# Make the repo root importable so tests can `import spacesim...`.
pythonpath = ["."]
testpaths = ["spacesim/tests"]
addopts = "-q --strict-markers"
markers = [
    "browser: drives the console in a headless Chromium (needs Playwright + a Chromium build; skips where absent)",
    "verifies(*ids): the requirement leaf / feature / package IDs this test verifies (FS-133)",
]

[tool.setuptools.packages.find]
include = ["spacesim*"]
